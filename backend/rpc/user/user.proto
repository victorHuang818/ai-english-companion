syntax = "proto3";

package user;
option go_package = "./user";

message RegisterReq {
  string username = 1;
  string email = 2;
  string password = 3;
}

message RegisterResp {
  string id = 1;
}

message LoginReq {
  string email = 1;
  string password = 2;
}

message LoginResp {
  string id = 1;
  string token = 2;
}

message GetUserInfoReq {
  string id = 1;
}

message GetUserInfoResp {
  string id = 1;
  string username = 2;
  string email = 3;
  uint32 daily_free_tokens = 4;
  uint64 recharge_tokens = 5;
}

message DeductTokenReq {
  string id = 1;
  uint32 amount = 2;
}

message DeductTokenResp {
  bool success = 1;
}

service User {
  rpc Register(RegisterReq) returns(RegisterResp);
  rpc Login(LoginReq) returns(LoginResp);
  rpc GetUserInfo(GetUserInfoReq) returns(GetUserInfoResp);
  rpc DeductToken(DeductTokenReq) returns(DeductTokenResp);
}
