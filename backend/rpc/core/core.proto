syntax = "proto3";

package core;
option go_package = "./core";

// --- User Profile & MinIO OSS ---

message GenerateUploadUrlReq {
  string filename = 1;
}

message GenerateUploadUrlResp {
  string upload_url = 1; // 预签名 PUT URL
  string object_key = 2; // 后续落库用的 OSS Key
}

message CreateUserProfileReq {
  string user_id = 1;
  string english_level = 2;   // beginner/intermediate/advanced
  string learning_target = 3;  // 学习目标
}

message CreateUserProfileResp {
  string id = 1;
  string status = 2; // 解析状态
}

message GetUserProfileReq {
  string id = 1;
}

message GetUserProfileResp {
  string id = 1;
  string user_id = 2;
  string english_level = 3;
  string learning_target = 4;
}

// --- Scenarios ---

message CreateScenarioReq {
  string creator_id = 1;
  string name = 2;
  string description = 3;
}

message CreateScenarioResp {
  string id = 1;
}

message GetScenarioReq {
  string id = 1;
}

message GetScenarioResp {
  string id = 1;
  string name = 2;
  string description = 3;
}

// --- Practice Sessions ---

message CreateSessionReq {
  string user_id = 1;
  string user_profile_id = 2;
  string scenario_id = 3;
}

message CreateSessionResp {
  string id = 1;
}

message UpdateSessionStatusReq {
  string id = 1;
  string status = 2;
  string evaluation_report = 3; // JSON
}

message UpdateSessionStatusResp {
  bool success = 1;
}

// --- Dialogues ---

message AddDialogueReq {
  string session_id = 1;
  string role = 2;
  string content = 3;
  string audio_object_key = 4; // 录音的 OSS key
  string evaluation = 5;       // 此轮回答的 AI 评估报告 (JSON 格式文本)
  bytes audio_content = 6;     // 用户回答的完整 WAV 音频内容字节
}

message AddDialogueResp {
  string id = 1;
}

message UpdateDialogueEvaluationReq {
  string dialogue_id = 1;
  string evaluation = 2;
}

message UpdateDialogueEvaluationResp {
  bool success = 1;
}

// --- 练习上下文查询 (专供 BFF API WebSocket 阶段调用) ---

message GetPracticeContextReq {
  string session_id = 1;
}

message GetPracticeContextResp {
  string session_id = 1;
  string english_level = 2;     // 英语水平
  string learning_target = 3;   // 学习目标
  string scenario_name = 4;     // 场景名称
  string scenario_desc = 5;     // 场景描述
  string user_id = 6;           // 用于后续 Token 额度扣减
}

message ListSessionsReq {
  string user_id = 1;
}

message SessionItem {
  string id = 1;
  string scenario_name = 2;
  string status = 3;
  int64 created_at = 4;
  int32 overall_score = 5;
}

message ListSessionsResp {
  repeated SessionItem sessions = 1;
}

message GetSessionDetailReq {
  string session_id = 1;
}

message GetSessionDetailResp {
  string session_id = 1;
  string scenario_name = 2;
  string transcript = 3; // 格式化后的对话文本
  int32 overall_score = 4;
  string evaluation_report = 5; // JSON
}

message DeleteSessionReq {
  string session_id = 1;
}

message DeleteSessionResp {
  bool success = 1;
}

service Core {
  // User Profile & OSS
  rpc GenerateUploadUrl(GenerateUploadUrlReq) returns(GenerateUploadUrlResp);
  rpc CreateUserProfile(CreateUserProfileReq) returns(CreateUserProfileResp);
  rpc GetUserProfile(GetUserProfileReq) returns(GetUserProfileResp);
  
  // Scenarios
  rpc CreateScenario(CreateScenarioReq) returns(CreateScenarioResp);
  rpc GetScenario(GetScenarioReq) returns(GetScenarioResp);
  
  // Practice Sessions
  rpc CreateSession(CreateSessionReq) returns(CreateSessionResp);
  rpc UpdateSessionStatus(UpdateSessionStatusReq) returns(UpdateSessionStatusResp);
  
  // Dialogues
  rpc AddDialogue(AddDialogueReq) returns(AddDialogueResp);
  rpc UpdateDialogueEvaluation(UpdateDialogueEvaluationReq) returns(UpdateDialogueEvaluationResp);

  // 上下文查询 (供 BFF WebSocket 阶段一次性调用，绕过流式链路)
  rpc GetPracticeContext(GetPracticeContextReq) returns(GetPracticeContextResp);

  // 列表与详情
  rpc ListSessions(ListSessionsReq) returns(ListSessionsResp);
  rpc GetSessionDetail(GetSessionDetailReq) returns(GetSessionDetailResp);
  rpc DeleteSession(DeleteSessionReq) returns(DeleteSessionResp);
}
