Name: ai.rpc
ListenOn: 0.0.0.0:10012
Timeout: 60000  # 60 seconds, overrides default 2s to allow DashScope calls to complete
# Etcd:
#   Hosts:
#   - 127.0.0.1:2379
#   Key: ai.rpc

# 🌟 AI 评论员 (多模态语音深度打分评估)
AiCommentator:
  Vendor: "DashScope"
  ApiKey: ${DASHSCOPE_API_KEY2}
  BaseUrl: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  Model: "qwen3.5-omni-flash"

# 🌟 AI 辅助提示 
AiSuggestion:
  Vendor: "DashScope"
  ApiKey: ${DASHSCOPE_API_KEY2}
  BaseUrl: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  Model: "qwen3.5-omni-flash"

Prometheus:
  Host: 0.0.0.0
  Port: 9085
  Path: /metrics