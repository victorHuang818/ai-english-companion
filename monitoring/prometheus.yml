global:
  scrape_interval: 15s # 每 15 秒拉取一次指标数据
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['127.0.0.1:9091']

  - job_name: 'interview_api'
    static_configs:
      - targets: ['127.0.0.1:9092']

  - job_name: 'core-rpc'
    static_configs:
      - targets: ['127.0.0.1:9093']

  - job_name: 'user-rpc'
    static_configs:
      - targets: ['127.0.0.1:9094']

  - job_name: 'ai-rpc'
    static_configs:
      - targets: ['127.0.0.1:9095']