worker_processes  auto;
# 🌟 新增：解除工作进程的文件描述符限制（必须大于 worker_connections）
worker_rlimit_nofile 65535; 

events {
    # 🌟 修改：单工作进程的最大连接数调大（在 4C8G Linux 上建议设为 20480 或 65535）
    worker_connections  20480; 
}

# worker_processes  auto;

# events {
#     worker_connections  1024;
# }

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 【修改项1】修复 Lua 在容器内的路径
    lua_package_path "/etc/nginx/lua/?.lua;;";

    server {
        # 没有完成备案，先用着8443
        listen 8443 ssl;
        server_name www.ginnyhub.com;

        # 证书配置路径（已经通过 -v 挂载，没问题）
        ssl_certificate     /root/cert/www.ginnyhub.com.pem;
        ssl_certificate_key /root/cert/www.ginnyhub.com.key;

        location / {
            # 【修改项3】改为容器内路径，启动时配合新的 -v 挂载
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html; 
        }

        # ==========================================
        # HTTP 业务接口代理 (匹配 /api/v1/...)
        # ==========================================
        location /api/ {
            # 【修改项4】使用宿主机在容器网桥上的内部网关 IP
            proxy_pass http://10.88.0.1:8880;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ==========================================
        # WebSocket 实时面试代理 (匹配 /ws/companion)
        # ==========================================
        location /ws/ {
            # 【修改项4】同样，使用宿主机在容器网桥上的内部网关 IP
            proxy_pass http://10.88.0.1:8880;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ==========================================
        # MinIO API Proxy
        # ==========================================
        location /minio/ {
            proxy_pass http://10.88.0.1:9000/;
            proxy_set_header Host 127.0.0.1:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}