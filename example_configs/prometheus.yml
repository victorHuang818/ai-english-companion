global:
  scrape_interval: 15s # 每 15 秒拉取一次指标数据
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['127.0.0.1:9081']

  - job_name: 'companion_api'
    static_configs:
      - targets: ['127.0.0.1:9082']

  - job_name: 'core-rpc'
    static_configs:
      - targets: ['127.0.0.1:9083']

  - job_name: 'user-rpc'
    static_configs:
      - targets: ['127.0.0.1:9084']

  - job_name: 'ai-rpc'
    static_configs:
      - targets: ['127.0.0.1:9085']