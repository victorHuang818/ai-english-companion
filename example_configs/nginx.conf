worker_processes  auto;
worker_rlimit_nofile 65535;

events {
    worker_connections  20480;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Lua 脚本路径（需与启动命令中 -v 挂载的路径一致）
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # ==========================================
    # AI English Companion (HTTPS, port 9443)
    # ==========================================
    server {
        listen 9443 ssl;
        server_name your.domain.com;  # 替换为您的域名或服务器 IP

        ssl_certificate     /path/to/your/cert.pem;   # 替换为您的 SSL 证书路径
        ssl_certificate_key /path/to/your/cert.key;   # 替换为您的 SSL 私钥路径

        # REST API 代理（转发至 Gateway :8880）
        location /api/ {
            # 10.88.0.1 为 Podman 容器网桥的宿主机内部地址，后端 Gateway 监听 8880 端口
            proxy_pass http://10.88.0.1:8880;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket 实时对讲代理（转发至 Gateway :8880）
        # Lua 限流：仅对 /ws/ 生效
        location /ws/ {
            access_by_lua_file /etc/nginx/lua/limit.lua;

            proxy_pass http://10.88.0.1:8880;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 前端静态资源（React SPA 打包产物）
        location / {
            root /usr/share/nginx/html_companion;  # 与启动命令中的 -v 挂载路径对应
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # MinIO 对象存储代理（音频文件访问）
        location /minio/ {
            proxy_pass http://10.88.0.1:9000/;
            proxy_set_header Host 127.0.0.1:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
